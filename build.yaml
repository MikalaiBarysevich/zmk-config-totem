include:
  # The dongle: split central, plugged into the host over USB.
  - board: seeeduino_xiao_ble
    shield: totem_dongle
    snippet: studio-rpc-usb-uart

  # Both halves are peripherals. Kconfig.defconfig makes the left half
  # central by default, so that has to be overridden here.
  - board: seeeduino_xiao_ble
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # No cmake-args here, on purpose: Kconfig.defconfig already turns ZMK_SPLIT
  # on for this shield and never makes it central, so they were redundant -
  # and a single -DCONFIG_ on the command line puts Zephyr into a strict mode
  # where the Kconfig warnings from totem_right.conf become fatal.
  - board: seeeduino_xiao_ble
    shield: totem_right

  # Flash this to all three devices before the first dongle firmware,
  # otherwise the old pairings keep the halves from finding the dongle.
  - board: seeeduino_xiao_ble
    shield: settings_reset
