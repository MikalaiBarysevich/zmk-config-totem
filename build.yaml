include:
  # The dongle: split central, plugged into the host over USB.
  - board: seeeduino_xiao_ble
    shield: totem_dongle
    snippet: studio-rpc-usb-uart

  # Both halves are peripherals. Kconfig.defconfig makes the left half
  # central by default, so that has to be overridden here.
  - board: seeeduino_xiao_ble
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # TEMPORARY, bring-up only: zmk-usb-logging makes this half appear as a USB
  # serial port and print what its matrix scans and what it sends to the
  # central, which separates a soldering fault from a pairing fault. Drop the
  # snippet once the half works.
  #
  # It has to be the snippet rather than CONFIG_ZMK_USB_LOGGING=y, because the
  # logger needs a CDC ACM node that the board's devicetree does not have; the
  # snippet adds it. No cmake-args either: Kconfig.defconfig already turns
  # ZMK_SPLIT on for this shield and never makes it central.
  - board: seeeduino_xiao_ble
    shield: totem_right
    snippet: zmk-usb-logging

  # TEMPORARY, bring-up only. The right half scans its matrix correctly but
  # gets ENOTCONN when it tries to notify the central, so this build says what
  # the dongle is doing about it: scanning, finding, connecting or failing to
  # bond. Studio is left out because its RPC transport and the logger both
  # want the one CDC ACM port.
  - board: seeeduino_xiao_ble
    shield: totem_dongle
    artifact-name: DEBUG-totem_dongle
    snippet: zmk-usb-logging

  # Flash this to all three devices before the first dongle firmware,
  # otherwise the old pairings keep the halves from finding the dongle.
  - board: seeeduino_xiao_ble
    shield: settings_reset
