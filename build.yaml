# power-bisect: measurement builds only, not for daily use.
# Each variant differs from right-base in exactly one setting.
include:
  - board: seeeduino_xiao_ble
    shield: totem_right
    artifact-name: right-base

  # DCDC off: the board Kconfig defaults BOARD_ENABLE_DCDC=y because the
  # genuine XIAO carries the DCC inductor network. This is a Super52840,
  # whose regulator layout is unknown.
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_BOARD_ENABLE_DCDC=n
    artifact-name: right-nodcdc

  # No battery measurement: drops the ADC and the P0.14 divider-enable
  # pin, the only internal pin the XIAO overlay drives.
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_BATTERY_REPORTING=n
    artifact-name: right-nobatt

  # No USB stack: rules out VBUS detection wired differently on this board
  # keeping the USB peripheral and its clock alive.
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_USB=n
    artifact-name: right-nousb
  # System OFF after 30 s idle: board current with the chip fully off.
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000
    artifact-name: right-off30
  # off30 + QSPI flash pins held at defined levels instead of floating.
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000 -DEXTRA_DTC_OVERLAY_FILE=$PWD/config/qspi-hog.overlay
    artifact-name: right-off30-qspihog
  # off30 + UICR.REGOUT0 programmed to 3.3 V (persistent!). LED: green = 3.3 V.
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000 -DCONFIG_TOTEM_REGOUT0_3V3=y
    artifact-name: right-off30-regout33
  # off30 + matrix polled every 1 ms always (same CPU duty as a held key).
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000 -DCONFIG_ZMK_KSCAN_MATRIX_POLLING=y -DEXTRA_DTC_OVERLAY_FILE=$PWD/config/poll1ms.overlay
    artifact-name: right-off30-poll1ms
  # poll1ms with REG1 DCDC off: is the awake-state current the DCDC?
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000 -DCONFIG_ZMK_KSCAN_MATRIX_POLLING=y -DEXTRA_DTC_OVERLAY_FILE=$PWD/config/poll1ms.overlay -DCONFIG_BOARD_ENABLE_DCDC=n
    artifact-name: right-off30-poll1ms-nodcdc
  # Diagnostics over USB serial (zmk-usb-logging). Not for current measurement.
  - board: seeeduino_xiao_ble
    shield: totem_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_TOTEM_DIAG=y
    artifact-name: right-diag
  # off30 with REG0 in DCDC mode (inductor NL1 is fitted on DCCH).
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000 -DCONFIG_TOTEM_DCDC_HV=y
    artifact-name: right-off30-hvdcdc
  # off30 + matrix polled every 5 ms always: cost of one CPU wake-up.
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000 -DCONFIG_ZMK_KSCAN_MATRIX_POLLING=y -DEXTRA_DTC_OVERLAY_FILE=$PWD/config/poll5ms.overlay
    artifact-name: right-off30-poll5ms
  # off30 + matrix polled every 10 ms always: cost of one CPU wake-up.
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000 -DCONFIG_ZMK_KSCAN_MATRIX_POLLING=y -DEXTRA_DTC_OVERLAY_FILE=$PWD/config/poll10ms.overlay
    artifact-name: right-off30-poll10ms
  # Daily right firmware, only change: scan every 5 ms while a key is held.
  - board: seeeduino_xiao_ble
    shield: totem_right
    cmake-args: -DEXTRA_DTC_OVERLAY_FILE=$PWD/config/scan5ms.overlay
    artifact-name: right-scan5
