# TEMPORARY, bring-up only. Remove this file once the right half works.
#
# The right half does not register key presses, and the config looks correct,
# so the half needs to say what it sees. With logging on it shows up as a USB
# serial port and prints every matrix scan and every position it sends to the
# central - which separates a soldering fault from a Bluetooth pairing fault.
#
# This cannot be passed as a -DCONFIG_... build argument: ZMK's prj.conf turns
# SERIAL, CONSOLE and UART_CONSOLE off to save power, ZMK_USB_LOGGING selects
# them back on, and Zephyr treats that conflict as fatal when the override
# comes from the command line. From a .conf file it is only a warning.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
