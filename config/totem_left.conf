# ZMK Studio: edit the keymap at runtime over USB, no reflash.
#
# This lives on the left half because the left half is the split central while
# only two controllers work. Studio can only talk to the central - that is
# where the keymap lives - so when the dongle comes back, this file goes away
# and totem_dongle.conf takes over again.
CONFIG_ZMK_STUDIO=y

# The unlock is a keymap binding, and on a real half it can actually be
# pressed: the combo_studio_unlock combo on the FN layer. So locking stays on
# here, unlike on the bare dongle.
CONFIG_ZMK_STUDIO_LOCKING=y

# Report both halves' battery levels, not just the central's.
#
# FETCHING makes the central read the peripheral's level over the split
# service; PROXY publishes it to the host as a second Battery Service entry.
# Both options live inside "if ZMK_SPLIT_ROLE_CENTRAL", so they belong here
# and in totem_dongle.conf - never in totem.conf, where the peripheral build
# would reject them as an unmet dependency.
#
# This only reaches the host over Bluetooth: ZMK carries battery level in the
# BLE Battery Service, and USB has no channel for it.
#
# PROXY was switched off for a while on the suspicion that the second Battery
# Service - which BlueZ complains about on every connection - was behind the
# disconnects. It was not. Correlating the kernel's own
# "hci0: Unexpected continuation" errors against the disconnects over five
# windows and four hours gave, per hour: 17.8/16.9, 79.6/71.5, 1.4/1.4,
# 3.2/1.6, 3.9/0.0. The disconnect rate simply is the host adapter's error
# rate, and nothing in this config moved it either way.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
