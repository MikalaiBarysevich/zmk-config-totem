# ZMK Studio: edit the keymap at runtime over USB, no reflash.
#
# This lives on the left half because the left half is the split central while
# only two controllers work. Studio can only talk to the central - that is
# where the keymap lives - so when the dongle comes back, this file goes away
# and totem_dongle.conf takes over again.
CONFIG_ZMK_STUDIO=y

# The unlock is a keymap binding, and on a real half it can actually be
# pressed: the combo_studio_unlock combo on the FN layer. So locking stays on
# here, unlike on the bare dongle.
CONFIG_ZMK_STUDIO_LOCKING=y

# Report both halves' battery levels, not just the central's.
#
# FETCHING makes the central read the peripheral's level over the split
# service; PROXY publishes it to the host as a second Battery Service entry.
# Both options live inside "if ZMK_SPLIT_ROLE_CENTRAL", so they belong here
# and in totem_dongle.conf - never in totem.conf, where the peripheral build
# would reject them as an unmet dependency.
#
# This only reaches the host over Bluetooth: ZMK carries battery level in the
# BLE Battery Service, and USB has no channel for it.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# PROXY is off while we hunt the remaining disconnects.
#
# It is the only thing this config adds that the host stack objects to out
# loud. BlueZ 5.87 supports exactly one battery per device, so on every single
# connection it walks into the second Battery Service and logs
#
#   profiles/battery/battery.c: More than one BATT service exists for this device
#
# then ignores it. Formally harmless. But it is also the one difference from
# the upstream TOTEM config that touches what BlueZ parses at connect time, and
# of everything still on the list it is by far the cheapest to test.
#
# FETCHING is deliberately left on, so this flips exactly one variable: the
# central still reads the peripheral's level over the split link, only nothing
# is published to the host. That means it is now inert - nothing consumes those
# events, since this build has no display - and it should come out too once the
# experiment has answered. Until then it stays, so the split link carries the
# same traffic as before and the second Battery Service is the only change.
#
# Cost while this is off: totem-battery and the waybar module show the central
# half only. The script degrades on its own, it reports whatever Battery Service
# characteristics it finds.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
