CONFIG_ZMK_USB_LOGGING=n
# Mouse keys on the FN layer (ported from the QH42 config).
CONFIG_ZMK_POINTING=y

# Radio transmit power: +8 dBm instead of Zephyr's 0 dBm default. The nRF52840
# allows it - the choice in zephyr/subsys/bluetooth/controller/Kconfig gates
# BT_CTLR_TX_PWR_PLUS_8 behind HAS_HW_NRF_RADIO_TX_PWR_HIGH, which this SoC has.
#
# Eight decibels of margin go to both radio links at once: half to half, and
# central to host. This file is included by every build in build.yaml, so both
# halves and the dongle pick it up.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
