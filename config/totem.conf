CONFIG_ZMK_USB_LOGGING=n
# Mouse keys on the FN layer (ported from the QH42 config).
CONFIG_ZMK_POINTING=y

# Deep sleep. Off by default in ZMK - `config ZMK_SLEEP` in app/Kconfig carries
# no `default` line at all - and leaving it off cost the left half a full
# battery overnight: 68% to 0% in seven hours while merely sitting connected,
# against 89% to 87% on the right half over the same hours. The only timeout
# that was active, ZMK_IDLE_TIMEOUT (30 s), just parks peripherals like a
# display; the radio and the matrix scan keep running.
#
# This belongs here rather than in totem_left.conf: both halves have to sleep,
# and the central cannot power down while the peripheral keeps the split link
# alive.
#
# ZMK_IDLE_SLEEP_TIMEOUT defaults to 900000 ms (15 min), which is left as is.
# Waking is by keypress and costs about a second to re-establish the links.
CONFIG_ZMK_SLEEP=y

# Boot protocol on the USB HID interface. Without it the keyboard is dead
# anywhere that speaks only HID boot protocol - BIOS/UEFI setup and GRUB - and
# that is exactly where a second keyboard is least likely to be at hand.
CONFIG_ZMK_USB_BOOT=y

