CONFIG_ZMK_USB_LOGGING=n
# Mouse keys on the FN layer (ported from the QH42 config).
CONFIG_ZMK_POINTING=y

# Deep sleep. Off by default in ZMK - `config ZMK_SLEEP` in app/Kconfig carries
# no `default` line at all - and leaving it off cost the left half a full
# battery overnight: 68% to 0% in seven hours while merely sitting connected,
# against 89% to 87% on the right half over the same hours. The only timeout
# that was active, ZMK_IDLE_TIMEOUT (30 s), just parks peripherals like a
# display; the radio and the matrix scan keep running.
#
# This belongs here rather than in totem_left.conf: both halves have to sleep,
# and the central cannot power down while the peripheral keeps the split link
# alive.
#
# ZMK_IDLE_SLEEP_TIMEOUT defaults to 900000 ms (15 min), which is left as is.
# Waking is by keypress and costs about a second to re-establish the links.
CONFIG_ZMK_SLEEP=y

# Boot protocol on the USB HID interface. Without it the keyboard is dead
# anywhere that speaks only HID boot protocol - BIOS/UEFI setup and GRUB - and
# that is exactly where a second keyboard is least likely to be at hand.
CONFIG_ZMK_USB_BOOT=y

# Leave the QSPI flash driver out: these controllers are clones carrying a
# different chip than ZMK's board overlay declares, the driver fails to probe
# it, and a failed device is one that never gets suspended.
#
# The spare controller has USB logging on, which is how this surfaced:
#
#   <err> qspi_nor: JEDEC id [68 40 15]
#
# ZMK's app/boards/seeeduino_xiao_ble.overlay declares `jedec-id = [85 60 15]`
# (Puya P25Q16H) along with matching sfdp-bfp data; 0x68 is Boya
# Microelectronics, so the ID check fails and nordic_qspi_nor errors out of
# init. zmk_pm_suspend_devices() in app/src/pm.c then skips it, because its
# first guard is `!device_is_ready(dev)` - so the nRF52840 QSPI block stays
# powered for good, which is a documented multi-milliamp idle penalty on this
# SoC. One report on Nordic DevZone put idle at 150 uA once QSPI was out.
#
# Nothing needs the chip: the board puts `zephyr,flash`, `zephyr,code-partition`
# and the NVS storage_partition all on internal flash0. The QSPI node is merely
# declared.
#
# Kconfig rather than `&qspi { status = "disabled"; }` on purpose - a devicetree
# override here would have to beat ZMK's own board overlay, and the order the
# two are applied in is not obvious. Dropping the driver does not depend on it.
# Confirmation is the binary getting smaller, since NRFX_QSPI and FLASH_JESD216
# go with it.
CONFIG_NORDIC_QSPI_NOR=n


# Internal REG0 to 3.3 V (UICR.REGOUT0, written once, persistent) - see
# zephyr/Kconfig. The single biggest idle-current fix on these controllers.
CONFIG_TOTEM_REGOUT0_3V3=y
