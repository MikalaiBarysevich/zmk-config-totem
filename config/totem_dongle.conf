# ZMK Studio: edit the keymap at runtime over USB, no reflash.
# Only meaningful on the dongle - it is the split central, so it is where
# the keymap lives and the only device Studio can talk to.
CONFIG_ZMK_STUDIO=y

# TEMPORARY: Studio hides its whole UI behind an unlock, and the unlock is a
# keymap binding - which cannot be pressed on a bare dongle, since it has no
# matrix. Disabled so the physical layout can be inspected before the halves
# are soldered. Set back to y (or drop this line) once the keyboard is built:
# &studio_unlock already sits on the ADJ layer.
CONFIG_ZMK_STUDIO_LOCKING=n

# Same battery reporting as the left half has while it is the central: read
# both peripherals' levels over the split service. See totem_left.conf for why
# this cannot go in totem.conf - the peripheral build would reject it as an
# unmet dependency.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# PROXY off here too, to keep the dongle build in step with totem_left.conf -
# see the long note there. When the replacement controller arrives and the
# dongle becomes the central again, this has to be decided on its own merits:
# the dongle has two peripherals, so it would publish three Battery Services,
# and BlueZ objects to the second as loudly as to the third.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
